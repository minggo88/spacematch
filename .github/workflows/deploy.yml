name: 🚀 Build & Deploy to Cafe24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" vite build

      - name: 📂 Copy public API files to dist
        run: |
          if [ -d "public/api" ]; then
            cp -r public/api dist/api
          fi
          if [ -d "public/locales" ]; then
            cp -r public/locales dist/locales
          fi

      - name: � Install lftp
        run: sudo apt-get install -y lftp

      - name: �🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy to Cafe24 via SFTP
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -i ~/.ssh/deploy_key -p ${{ secrets.SFTP_PORT }}';
            open sftp://${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }};
            mirror --reverse --verbose --delete dist/ /www/;
            quit
          "

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
