name: 🚀 Build & Deploy to Cafe24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" vite build

      - name: 📂 Copy public API files to dist
        run: |
          if [ -d "public/api" ]; then
            cp -r public/api dist/api
          fi
          if [ -d "public/locales" ]; then
            cp -r public/locales dist/locales
          fi

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy to Cafe24 via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          # Generate sftp batch commands
          cd dist
          find . -type f | while read file; do
            dir=$(dirname "$file")
            if [ "$dir" != "." ]; then
              echo "-mkdir /www/$dir"
            fi
          done | sort -u > /tmp/sftp_dirs.txt

          find . -type f | while read file; do
            echo "put $file /www/$file"
          done > /tmp/sftp_files.txt

          # Combine: create dirs first, then upload files
          cat /tmp/sftp_dirs.txt /tmp/sftp_files.txt > /tmp/sftp_batch.txt

          # Execute sftp batch
          sftp -i ~/.ssh/deploy_key -P ${SFTP_PORT} -b /tmp/sftp_batch.txt ${SFTP_USERNAME}@${SFTP_HOST}

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/sftp_batch.txt /tmp/sftp_dirs.txt /tmp/sftp_files.txt
