name: 🚀 Build & Deploy to Cafe24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" vite build

      - name: 📂 Copy public files to dist
        run: |
          if [ -d "public/api" ]; then
            cp -r public/api dist/api
          fi
          if [ -d "public/locales" ]; then
            cp -r public/locales dist/locales
          fi

      - name: � Install SFTP client
        run: npm install ssh2-sftp-client

      - name: 🚀 Deploy to Cafe24
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: node scripts/deploy.cjs
