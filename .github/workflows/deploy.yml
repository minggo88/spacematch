name: 🚀 Build & Deploy to Cafe24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" vite build

      - name: 📂 Copy public API files to dist
        run: |
          if [ -d "public/api" ]; then
            cp -r public/api dist/api
          fi
          if [ -d "public/locales" ]; then
            cp -r public/locales dist/locales
          fi

      - name: 🚀 Deploy to Cafe24 via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './dist/*'
          remote_path: '/www/'
          sftpArgs: '-o StrictHostKeyChecking=no'
