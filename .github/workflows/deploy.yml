name: 🚀 Build & Deploy to Cafe24

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npx cross-env NODE_OPTIONS="--max-old-space-size=8192" vite build

      - name: 📂 Copy public API files to dist
        run: |
          if [ -d "public/api" ]; then
            cp -r public/api dist/api
          fi
          if [ -d "public/locales" ]; then
            cp -r public/locales dist/locales
          fi

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SFTP_PORT }} ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy to Cafe24 via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          cd dist

          # Generate sftp batch file with proper paths
          # 1. Create all directories (parent dirs first, sorted for proper order)
          find . -type d | sed 's|^\./||' | grep -v '^\.$' | sort | while read dir; do
            echo "-mkdir /www/${dir}"
          done > /tmp/sftp_batch.txt

          # 2. Upload all files with correct paths
          find . -type f | sed 's|^\./||' | while read file; do
            echo "put ${file} /www/${file}"
          done >> /tmp/sftp_batch.txt

          echo "quit" >> /tmp/sftp_batch.txt

          # Show batch file for debugging
          echo "=== SFTP Batch Commands (first 30 lines) ==="
          head -30 /tmp/sftp_batch.txt
          echo "=== Total commands: $(wc -l < /tmp/sftp_batch.txt) ==="

          # Execute sftp batch (use -b - to ignore errors on mkdir for existing dirs)
          sftp -i ~/.ssh/deploy_key -P ${SFTP_PORT} -b /tmp/sftp_batch.txt ${SFTP_USERNAME}@${SFTP_HOST} || {
            echo "SFTP batch had errors (likely existing dirs). Retrying file uploads only..."
            # Retry with only file uploads (skip mkdir)
            find . -type f | sed 's|^\./||' | while read file; do
              echo "put ${file} /www/${file}"
            done > /tmp/sftp_files_only.txt
            echo "quit" >> /tmp/sftp_files_only.txt
            sftp -i ~/.ssh/deploy_key -P ${SFTP_PORT} -b /tmp/sftp_files_only.txt ${SFTP_USERNAME}@${SFTP_HOST}
          }

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/sftp_batch.txt /tmp/sftp_files_only.txt
