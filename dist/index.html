                    {

                        desc: '모든 사용자(셀러, 호스트, 벤더)의 계정을 관리하세요. 가입 승인, 권한 변경, 계정 정지/복구  등의 작업을 수행할 수 있습니다.',
                        tip: '💡 사용자 상세 페이지에서 전체 활동 이력을 확인할 수 있어요.'
                    },
                    {
                        icon: '🏪', title: '공간 및 입점 관리',
                        desc: '등록된 모든 공간과 입점 신청을 검토하고 승인하세요. 부적절한 콘텐츠가 있으면 경고 또는 삭제 조치를 취할 수 있습니다.',
                        tip: '💡 필터를 사용해 대기 중인 신청만 모아서 처리하면 효율적이에요.'
                    },
                    {
                        icon: '💳', title: '결제 · 정산 관리',
                        desc: '플랫폼의 모든 결제 내역과 정산 처리를 관리합니다. 환불 요청 처리, 수수료 설정, 정산 스케줄 관리 등을 한 곳에서 처리하세요.',
                        tip: '💡 결제 분쟁이 발생하면 관련 내역을 바로 조회할 수 있어요.'
                    }
                ]
            };
            GUIDE_STEPS.superadmin = GUIDE_STEPS.admin;

            var ROLE_NAMES = { seller: '셀러', host: '호스트', vendor: '벤더', admin: '관리자', superadmin: '슈퍼 관리자' };
            var ROLE_COLORS = { seller: '#10b981', host: '#f59e0b', vendor: '#8b5cf6', admin: '#ef4444', superadmin: '#ef4444' };
            var ROLE_BG = { seller: 'rgba(16,185,129,0.08)', host: 'rgba(245,158,11,0.08)', vendor: 'rgba(139,92,246,0.08)', admin: 'rgba(239,68,68,0.08)', superadmin: 'rgba(239,68,68,0.08)' };
            var ROLE_BORDER = { seller: 'rgba(16,185,129,0.2)', host: 'rgba(245,158,11,0.2)', vendor: 'rgba(139,92,246,0.2)', admin: 'rgba(239,68,68,0.2)', superadmin: 'rgba(239,68,68,0.2)' };
            var ROLE_ICON_BG = { seller: 'rgba(16,185,129,0.12)', host: 'rgba(245,158,11,0.12)', vendor: 'rgba(139,92,246,0.12)', admin: 'rgba(239,68,68,0.12)', superadmin: 'rgba(239,68,68,0.12)' };

            function initOnboarding() {
                if (window.location.pathname === '/login' || window.location.pathname === '/signup'
                    || window.location.pathname === '/' || window.location.pathname === '/services'
                    || window.location.pathname === '/about' || window.location.pathname === '/contact') return;

                fetch('/api/auth/me.php', { credentials: 'include' })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (!data.success || !data.user) return;
                        var user = data.user;
                        var role = user.role;
                        var uid = user.id || user.email || 'default';
                        var guideRole = (role === 'superadmin') ? 'superadmin' : (role === 'admin') ? 'admin' : (role === 'host') ? 'host' : (role === 'vendor') ? 'vendor' : 'seller';
                        var steps = GUIDE_STEPS[guideRole];
                        if (!steps || steps.length === 0) return;
                        if (localStorage.getItem('onboarding_dismiss_forever_' + uid) === 'true') return;
                        var today = new Date().toDateString();
                        if (localStorage.getItem('onboarding_dismiss_today_' + uid) === today) return;
                        showGuide(steps, uid, guideRole, user.name || user.company_name || '');
                    })
                    .catch(function () { });
            }

            function showGuide(steps, uid, guideRole, userName) {
                var currentStep = 0;
                var roleName = ROLE_NAMES[guideRole] || '사용자';
                var roleColor = ROLE_COLORS[guideRole] || '#6366f1';
                var roleBg = ROLE_BG[guideRole] || 'rgba(99,102,241,0.08)';
                var roleBorder = ROLE_BORDER[guideRole] || 'rgba(99,102,241,0.2)';
                var roleIconBg = ROLE_ICON_BG[guideRole] || 'rgba(99,102,241,0.12)';

                function isMobile() { return window.innerWidth < 768; }

                var overlay = document.createElement('div');
                overlay.id = 'onboarding-overlay';
                overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px);transition:opacity 0.3s;';
                overlay.onclick = function () { dismissToday(); };

                var card = document.createElement('div');
                card.id = 'onboarding-card';
                card.onclick = function (e) { e.stopPropagation(); };

                var style = document.createElement('style');
                style.textContent = ''
                    + '@keyframes onb-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.85)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}'
                    + '@keyframes onb-slide{0%{opacity:0;transform:translateY(100%)}100%{opacity:1;transform:translateY(0)}}';
                document.head.appendChild(style);

                function applyCardStyle() {
                    if (isMobile()) {
                        card.style.cssText = 'position:fixed;z-index:100000;bottom:0;left:0;right:0;width:100%;max-height:85vh;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.25);overflow-y:auto;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;animation:onb-slide 0.35s ease-out;padding-bottom:env(safe-area-inset-bottom,0);-webkit-overflow-scrolling:touch;';
                    } else {
                        card.style.cssText = 'position:fixed;z-index:100000;top:50%;left:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100vw - 32px);max-height:90vh;background:#fff;border-radius:24px;box-shadow:0 25px 60px rgba(0,0,0,0.35),0 0 0 1px rgba(0,0,0,0.05);overflow-y:auto;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;animation:onb-pop 0.4s cubic-bezier(0.34,1.56,0.64,1);';
                    }
                }

                // 화면 회전/리사이즈 대응
                var resizeTimer;
                function onResize() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () { applyCardStyle(); }, 150);
                }
                window.addEventListener('resize', onResize);

                function render() {
                    var step = steps[currentStep];
                    var progress = ((currentStep + 1) / steps.length) * 100;
                    var isLast = currentStep === steps.length - 1;
                    var m = isMobile();

                    applyCardStyle();

                    // 모바일/PC 분기 스타일 변수
                    var pad = m ? '16px' : '24px';
                    var padTop = m ? '16px' : '20px';
                    var iconSize = m ? '36px' : '44px';
                    var iconFont = m ? '16px' : '20px';
                    var titleFont = m ? '14px' : '16px';
                    var stepIconSize = m ? '46px' : '56px';
                    var stepIconFont = m ? '24px' : '30px';
                    var stepTitleFont = m ? '16px' : '18px';
                    var descFont = m ? '13px' : '14px';
                    var tipFont = m ? '11px' : '12px';
                    var tipPad = m ? '10px 12px' : '12px 14px';
                    var btnPad = m ? '12px 16px' : '10px 20px';
                    var btnFont = m ? '13px' : '13px';
                    var dotSize = m ? '6px' : '7px';
                    var dotActive = m ? '22px' : '28px';
                    var contentPad = m ? '16px' : '20px';
                    var closeBtnSize = m ? '38px' : '34px';

                    card.innerHTML = ''
                        // Handle bar (모바일)
                        + (m ? '<div style="display:flex;justify-content:center;padding:10px 0 4px"><div style="width:36px;height:4px;border-radius:2px;background:#d1d5db"></div></div>' : '')
                        // Progress bar
                        + '<div style="height:' + (m ? '4px' : '5px') + ';background:#f1f5f9;' + (m ? '' : '') + '"><div style="height:100%;background:linear-gradient(to right,' + roleColor + ',#6366f1);transition:width 0.5s;width:' + progress + '%"></div></div>'
                        // Header
                        + '<div style="padding:' + padTop + ' ' + pad + ' 0">'
                        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:' + (m ? '12px' : '14px') + '">'
                        + '<div style="display:flex;align-items:center;gap:' + (m ? '10px' : '12px') + '">'
                        + '<div style="width:' + iconSize + ';height:' + iconSize + ';background:linear-gradient(135deg,' + roleColor + ',#6366f1);border-radius:' + (m ? '12px' : '14px') + ';display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(99,102,241,0.3);color:#fff;font-size:' + iconFont + '">✨</div>'
                        + '<div>'
                        + '<p style="font-size:' + titleFont + ';font-weight:800;color:#111827;margin:0;letter-spacing:-0.3px">시작 가이드</p>'
                        + '<div style="display:flex;align-items:center;gap:6px;margin-top:3px">'
                        + '<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;background:' + roleBg + ';border:1px solid ' + roleBorder + '">'
                        + '<span style="width:4px;height:4px;border-radius:50%;background:' + roleColor + '"></span>'
                        + '<span style="font-size:' + (m ? '9px' : '10px') + ';font-weight:600;color:' + roleColor + '">' + roleName + '</span>'
                        + '</span>'
                        + '<span style="font-size:' + (m ? '10px' : '11px') + ';color:#9ca3af;font-weight:600">' + (currentStep + 1) + '/' + steps.length + '</span>'
                        + '</div>'
                        + '</div>'
                        + '</div>'
                        + '<button id="onb-close" style="width:' + closeBtnSize + ';height:' + closeBtnSize + ';min-width:' + closeBtnSize + ';border-radius:10px;border:none;background:#f1f5f9;cursor:pointer;font-size:16px;color:#6b7280;display:flex;align-items:center;justify-content:center">✕</button>'
                        + '</div>'
                        + '</div>'
                        // Content
                        + '<div style="padding:0 ' + pad + ' ' + (m ? '16px' : '20px') + '">'
                        + '<div style="background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-radius:' + (m ? '14px' : '16px') + ';padding:' + contentPad + ';margin-bottom:' + (m ? '12px' : '16px') + ';border:1px solid #e2e8f0">'
                        + '<div style="display:flex;align-items:center;gap:' + (m ? '12px' : '14px') + ';margin-bottom:' + (m ? '10px' : '14px') + '">'
                        + '<div style="width:' + stepIconSize + ';height:' + stepIconSize + ';background:' + roleIconBg + ';border-radius:' + (m ? '14px' : '16px') + ';display:flex;align-items:center;justify-content:center;font-size:' + stepIconFont + ';flex-shrink:0;border:1px solid ' + roleBorder + '">' + step.icon + '</div>'
                        + '<div style="flex:1">'
                        + '<h4 style="font-size:' + stepTitleFont + ';font-weight:800;color:#111827;margin:0;line-height:1.3;letter-spacing:-0.3px">' + step.title + '</h4>'
                        + '</div>'
                        + '</div>'
                        + '<p style="font-size:' + descFont + ';color:#374151;line-height:1.7;margin:0 0 ' + (m ? '10px' : '14px') + ';word-break:keep-all">' + step.desc + '</p>'
                        + (step.tip ? '<div style="padding:' + tipPad + ';background:rgba(255,251,235,0.8);border-radius:' + (m ? '10px' : '12px') + ';border:1px solid #fde68a"><p style="font-size:' + tipFont + ';color:#92400e;line-height:1.5;margin:0;font-weight:600">' + step.tip + '</p></div>' : '')
                        + '</div>'
                        // Dots
                        + '<div style="display:flex;align-items:center;gap:' + (m ? '4px' : '5px') + ';margin-bottom:' + (m ? '12px' : '16px') + ';justify-content:center">'
                        + steps.map(function (_, i) {
                            return '<span class="onb-dot" data-i="' + i + '" style="display:inline-block;height:' + dotSize + ';border-radius:4px;cursor:pointer;transition:all 0.3s;'
                                + (i === currentStep ? 'width:' + dotActive + ';background:#6366f1' : i < currentStep ? 'width:' + dotSize + ';background:#a5b4fc' : 'width:' + dotSize + ';background:#e2e8f0')
                                + '"></span>';
                        }).join('')
                        + '</div>'
                        // Buttons
                        + '<div style="display:flex;align-items:center;gap:' + (m ? '8px' : '10px') + '">'
                        + (currentStep > 0 ? '<button id="onb-prev" style="display:flex;align-items:center;justify-content:center;padding:' + btnPad + ';font-size:' + btnFont + ';font-weight:700;color:#6b7280;background:#f1f5f9;border:none;border-radius:12px;cursor:pointer;min-height:44px">← 이전</button>' : '')
                        + '<div style="flex:1"></div>'
                        + '<button id="onb-next" style="display:flex;align-items:center;justify-content:center;padding:' + btnPad + ';font-size:' + btnFont + ';font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#9333ea);border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,0.35);min-height:44px">' + (isLast ? '완료하기 ✓' : '다음으로 →') + '</button>'
                        + '</div>'
                        // Dismiss
                        + '<div style="margin-top:' + (m ? '10px' : '14px') + ';padding-top:' + (m ? '10px' : '14px') + ';border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:center;gap:' + (m ? '12px' : '16px') + '">'
                        + '<button id="onb-today" style="font-size:' + (m ? '11px' : '12px') + ';color:#9ca3af;background:none;border:none;cursor:pointer;font-weight:500;min-height:36px;padding:6px 8px">오늘 그만 보기</button>'
                        + '<span style="color:#e2e8f0;font-size:10px">|</span>'
                        + '<button id="onb-forever" style="display:flex;align-items:center;gap:4px;font-size:' + (m ? '11px' : '12px') + ';color:#9ca3af;background:none;border:none;cursor:pointer;font-weight:500;min-height:36px;padding:6px 8px">🙈 더 이상 보지 않기</button>'
                        + '</div>'
                        + '</div>';

                    card.querySelector('#onb-close').onclick = function () { dismissToday(); };
                    card.querySelector('#onb-next').onclick = function () {
                        if (currentStep < steps.length - 1) { currentStep++; render(); }
                        else { dismissToday(); }
                    };
                    var prevBtn = card.querySelector('#onb-prev');
                    if (prevBtn) prevBtn.onclick = function () { if (currentStep > 0) { currentStep--; render(); } };
                    card.querySelector('#onb-today').onclick = function () { dismissToday(); };
                    card.querySelector('#onb-forever').onclick = function () { dismissForever(); };
                    var dots = card.querySelectorAll('.onb-dot');
                    dots.forEach(function (dot) {
                        dot.onclick = function () { currentStep = parseInt(dot.getAttribute('data-i')); render(); };
                    });
                }

                function dismissToday() {
                    localStorage.setItem('onboarding_dismiss_today_' + uid, new Date().toDateString());
                    close();
                }
                function dismissForever() {
                    localStorage.setItem('onboarding_dismiss_forever_' + uid, 'true');
                    close();
                }
                function close() {
                    window.removeEventListener('resize', onResize);
                    overlay.style.opacity = '0';
                    if (isMobile()) {
                        card.style.transform = 'translateY(100%)';
                        card.style.opacity = '0';
                    } else {
                        card.style.opacity = '0';
                        card.style.transform = 'translate(-50%,-50%) scale(0.9)';
                    }
                    setTimeout(function () {
                        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                        if (card.parentNode) card.parentNode.removeChild(card);
                    }, 300);
                }

                render();
                document.body.appendChild(overlay);
                document.body.appendChild(card);
            }

            setTimeout(initOnboarding, 2000);
        })();
    </script>
</body>

</html>
