                                + (i === currentStep ? 'width:28px;background:#6366f1' : i < currentStep ? 'width:7px;background:#a5b4fc' : 'width:7px;background:#e2e8f0')
                                + '"></span>';
                        }).join('')
                        + '</div>'
                        // Buttons
                        + '<div style="display:flex;align-items:center;gap:10px">'
                        + (currentStep > 0 ? '<button id="onb-prev" style="display:flex;align-items:center;gap:4px;padding:10px 16px;font-size:13px;font-weight:700;color:#6b7280;background:#f1f5f9;border:none;border-radius:12px;cursor:pointer;transition:background 0.2s"onmouseover="this.style.background=\'#e2e8f0\'"onmouseout="this.style.background=\'#f1f5f9\'">← 이전</button>' : '')
                        + '<div style="flex:1"></div>'
                        + '<button id="onb-next" style="display:flex;align-items:center;gap:4px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#9333ea);border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,0.35);transition:transform 0.2s"onmouseover="this.style.transform=\'translateY(-1px)\'"onmouseout="this.style.transform=\'none\'">' + (isLast ? '완료하기 ✓' : '다음으로 →') + '</button>'
                        + '</div>'
                        // Dismiss
                        + '<div style="margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:center;gap:16px">'
                        + '<button id="onb-today" style="font-size:12px;color:#9ca3af;background:none;border:none;cursor:pointer;font-weight:500;transition:color 0.2s"onmouseover="this.style.color=\'#6b7280\'"onmouseout="this.style.color=\'#9ca3af\'">오늘 그만 보기</button>'
                        + '<span style="color:#e2e8f0;font-size:10px">|</span>'
                        + '<button id="onb-forever" style="display:flex;align-items:center;gap:4px;font-size:12px;color:#9ca3af;background:none;border:none;cursor:pointer;font-weight:500;transition:color 0.2s"onmouseover="this.style.color=\'#6b7280\'"onmouseout="this.style.color=\'#9ca3af\'">🙈 더 이상 보지 않기</button>'
                        + '</div>'
                        + '</div>';

                    card.querySelector('#onb-close').onclick = function () { dismissToday(); };
                    card.querySelector('#onb-next').onclick = function () {
                        if (currentStep < steps.length - 1) { currentStep++; render(); }
                        else { dismissToday(); }
                    };
                    var prevBtn = card.querySelector('#onb-prev');
                    if (prevBtn) prevBtn.onclick = function () { if (currentStep > 0) { currentStep--; render(); } };
                    card.querySelector('#onb-today').onclick = function () { dismissToday(); };
                    card.querySelector('#onb-forever').onclick = function () { dismissForever(); };
                    var dots = card.querySelectorAll('.onb-dot');
                    dots.forEach(function (dot) {
                        dot.onclick = function () { currentStep = parseInt(dot.getAttribute('data-i')); render(); };
                    });
                }

                function dismissToday() {
                    localStorage.setItem('onboarding_dismiss_today_' + uid, new Date().toDateString());
                    close();
                }
                function dismissForever() {
                    localStorage.setItem('onboarding_dismiss_forever_' + uid, 'true');
                    close();
                }
                function close() {
                    overlay.style.opacity = '0';
                    card.style.opacity = '0';
                    card.style.transform = 'translate(-50%,-50%) scale(0.9)';
                    setTimeout(function () {
                        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                        if (card.parentNode) card.parentNode.removeChild(card);
                    }, 300);
                }

                render();
                document.body.appendChild(overlay);
                document.body.appendChild(card);
            }

            setTimeout(initOnboarding, 2000);
        })();
    </script>
</body>

</html>
