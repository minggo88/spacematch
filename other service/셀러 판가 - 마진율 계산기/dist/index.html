    <h2>판가 계산기 — 적정 판매가 자동 산출</h2>
    <p>원가(매입가)에 배송비, 포장비, 인건비, 플랫폼 수수료, 결제 수수료, 부가세까지 모든 비용을 반영하여 적정 판매가(판가)를 자동으로 계산합니다. 목표 마진율을 설정하면 최소 판매가를 역산해 드립니다.
    </p>

    <h2>마진율 계산기 — 실시간 마진율 분석</h2>
    <p>마진율 계산법: (판매가 - 총비용) ÷ 판매가 × 100. 모든 비용 항목을 입력하면 순이익과 마진율을 즉시 확인하고, 비용 구조를 도넛 차트로 시각화합니다.</p>

    <h2>주요 기능</h2>
    <ul>
      <li>판가 계산 — 원가 기반 적정 판매가(판가) 자동 산출</li>
      <li>마진율 계산 — 실시간 마진율 분석 및 마진율 계산법 적용</li>
      <li>단가 계산 — 개별 상품 단가 및 수량별 비용 계산</li>
      <li>원가 계산 — 매입가 및 부대비용 포함 총원가</li>
      <li>판매가 계산 — 목표 마진율 기반 역산</li>
      <li>매출 및 마진 계산 — 순이익 구조 분석</li>
      <li>플랫폼 수수료 자동 반영 — 쿠팡(10.8%), 스마트스토어(5.6%), 무신사(34%), G마켓, 옥션, 11번가 등</li>
      <li>택배비 계산 — 배송비 포함 비용 구조</li>
      <li>공급가 계산 — 원가 + 부대비용 통합 계산</li>
      <li>부가세 포함/미포함 전환 계산</li>
    </ul>

    <h2>지원 플랫폼</h2>
    <p>쿠팡, 네이버 스마트스토어, 무신사 파트너스, G마켓, 옥션, 11번가, 카카오 쇼핑, 위메프 등 국내 주요 이커머스 플랫폼의 수수료를 자동으로 반영합니다.</p>

    <h2>자주 묻는 질문</h2>
    <h3>마진율 계산법이 궁금합니다</h3>
    <p>마진율 = (판매가 - 총비용) ÷ 판매가 × 100. 총비용에는 매입가(원가), 배송비, 포장비, 인건비, 플랫폼 수수료, 결제 수수료, 부가세가 포함됩니다.</p>
